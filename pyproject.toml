[project]
name = "gh-community"
version = "0.1.0"
description = "Contributor analysis for GitHub repositories"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "PyGithub>=2.5",
    "PyYAML>=6",
    "typer>=0.12",
]

[project.scripts]
gh-community = "gh_community.cli:main"

[dependency-groups]
dev = [
    "pre-commit",
    "pytest",
    "ruff==0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gh_community"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
