default_install_hook_types: [pre-commit, prepare-commit-msg, post-commit]

repos:
  - repo: https://github.com/PyCalendar/ai-prompt-auto-commit
    rev: v0.0.10
    hooks:
      - id: prepare-ai-repository
      - id: unstage-ai-prompts
      - id: append-ai-prompts
      - id: archive-ai-prompts

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: debug-statements
      - id: end-of-file-fixer
        exclude: ^(calendaring-sync|static/vendor)/
      - id: trailing-whitespace
        exclude: ^(calendaring-sync|static/vendor)/
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10 # also update pyproject.toml
    hooks:
      # Run the linter.
      - id: ruff-check
        args: [--config, "pyproject.toml", --fix]
      # Run the formatter.
      - id: ruff-format
        args: [--config, "pyproject.toml"]
