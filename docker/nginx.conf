# nginx in front of gunicorn, like myco-webshop: it serves the static files
# itself and passes everything else on. Runs as any user: files in /tmp,
# logs to the console. LISTEN_PORT is replaced by $PORT at start.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    access_log /dev/stdout;
    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json text/csv;

    server {
        listen LISTEN_PORT;
        listen [::]:LISTEN_PORT;
        client_max_body_size 1M;
        proxy_read_timeout 300s;

        # The pages name the static files with a hash of their content (style.4f3a1c2b9d0e.css,
        # CompressedManifestStaticFilesStorage): a new version has a new name, so browsers may
        # keep each for a year. A name without a hash is asked for again each time (ETag), so
        # a browser never keeps an old script, as it did with 7 days for every file.
        location ~ "^/static/(?<file>.+\.[0-9a-f]{12}\.[A-Za-z0-9]+)$" {
            alias /app/staticfiles/$file;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location /static/ {
            alias /app/staticfiles/;
            add_header Cache-Control "no-cache";
        }

        # the rules for crawlers, without waiting for gunicorn when it is busy
        location = /robots.txt {
            alias /app/staticfiles/robots.txt;
            default_type text/plain;
            expires 1d;
        }

        location / {
            proxy_pass http://127.0.0.1:8000;
            # HTTP/1.1 to gunicorn as from the browser; nginx would send HTTP/1.0
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }
    }
}
