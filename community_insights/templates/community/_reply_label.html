{% load i18n %}{# The coloured label of the replies of a person (green, yellow, red), linked to them. #}<a class="badge text-decoration-none {% if person.status == "green" %}text-bg-success{% elif person.status == "yellow" %}text-bg-warning{% else %}text-bg-danger{% endif %}" href="{% url 'person_replies' scope.text person.login %}{{ scope.query }}" title="{% blocktranslate with login=person.login %}Replies of {{ login }}{% endblocktranslate %}">{% if person.status == "green" %}{% translate "answered" %}{% elif person.status == "yellow" %}{% translate "only one, not answered" %}{% else %}{% translate "not answered" %}{% endif %}</a>
