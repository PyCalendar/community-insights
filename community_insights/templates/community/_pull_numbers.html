{# Numbers of pull requests by repository ("found": {"owner/name": [1, 2]}), linked to GitHub; "-" for none. #}{% for repository, numbers in found.items %}<div><span class="text-muted">{{ repository }}</span> {% for number in numbers %}<a href="https://github.com/{{ repository }}/pull/{{ number }}">#{{ number }}</a>{% if not forloop.last %} {% endif %}{% endfor %}</div>{% empty %}-{% endfor %}
